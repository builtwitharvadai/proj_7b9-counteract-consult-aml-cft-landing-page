<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-labelledby="cauTitle cauDesc">
  <title id="cauTitle">Caution</title>
  <desc id="cauDesc">Pixel-aesthetic triangular warning icon with exclamation mark, in Bright Green for high visibility.</desc>

  <!-- 40x40 grid, each pixel is 4x4. Warning triangle with exclamation. -->
  <g fill="#00FD00">
    <!-- Row 0: apex -->
    <rect x="16" y="0" width="4" height="4"/>
    <rect x="20" y="0" width="4" height="4"/>

    <!-- Row 1 -->
    <rect x="16" y="4" width="4" height="4"/>
    <rect x="20" y="4" width="4" height="4"/>

    <!-- Row 2: widening -->
    <rect x="12" y="8" width="4" height="4"/>
    <rect x="16" y="8" width="4" height="4"/>
    <rect x="20" y="8" width="4" height="4"/>
    <rect x="24" y="8" width="4" height="4"/>

    <!-- Row 3 -->
    <rect x="12" y="12" width="4" height="4"/>
    <rect x="24" y="12" width="4" height="4"/>
    <!-- Exclamation top -->
    <rect x="18" y="12" width="4" height="4"/>

    <!-- Row 4 -->
    <rect x="8" y="16" width="4" height="4"/>
    <rect x="12" y="16" width="4" height="4"/>
    <rect x="24" y="16" width="4" height="4"/>
    <rect x="28" y="16" width="4" height="4"/>
    <!-- Exclamation body -->
    <rect x="18" y="16" width="4" height="4"/>

    <!-- Row 5 -->
    <rect x="8" y="20" width="4" height="4"/>
    <rect x="28" y="20" width="4" height="4"/>
    <!-- Exclamation body -->
    <rect x="18" y="20" width="4" height="4"/>

    <!-- Row 6 -->
    <rect x="4" y="24" width="4" height="4"/>
    <rect x="8" y="24" width="4" height="4"/>
    <rect x="28" y="24" width="4" height="4"/>
    <rect x="32" y="24" width="4" height="4"/>
    <!-- Exclamation dot -->
    <rect x="18" y="28" width="4" height="4"/>

    <!-- Row 7 -->
    <rect x="4" y="28" width="4" height="4"/>
    <rect x="32" y="28" width="4" height="4"/>

    <!-- Row 8: base row -->
    <rect x="0" y="32" width="4" height="4"/>
    <rect x="4" y="32" width="4" height="4"/>
    <rect x="8" y="32" width="4" height="4"/>
    <rect x="12" y="32" width="4" height="4"/>
    <rect x="16" y="32" width="4" height="4"/>
    <rect x="20" y="32" width="4" height="4"/>
    <rect x="24" y="32" width="4" height="4"/>
    <rect x="28" y="32" width="4" height="4"/>
    <rect x="32" y="32" width="4" height="4"/>
    <rect x="36" y="32" width="4" height="4"/>

    <!-- Row 9: base row -->
    <rect x="0" y="36" width="4" height="4"/>
    <rect x="4" y="36" width="4" height="4"/>
    <rect x="8" y="36" width="4" height="4"/>
    <rect x="12" y="36" width="4" height="4"/>
    <rect x="16" y="36" width="4" height="4"/>
    <rect x="20" y="36" width="4" height="4"/>
    <rect x="24" y="36" width="4" height="4"/>
    <rect x="28" y="36" width="4" height="4"/>
    <rect x="32" y="36" width="4" height="4"/>
    <rect x="36" y="36" width="4" height="4"/>
  </g>
</svg>
