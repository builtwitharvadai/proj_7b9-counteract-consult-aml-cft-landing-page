<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="caIconTitle caIconDesc">
  <title id="caIconTitle">CounterAct Consult icon</title>
  <desc id="caIconDesc">Pixel-aesthetic shield symbol containing a stylized C counter-mark in Primary Blue.</desc>

  <g fill="#2C3EF8">
    <!-- Shield outer silhouette (10x10 pixel grid) -->
    <rect x="20" y="10" width="10" height="10"/>
    <rect x="30" y="10" width="10" height="10"/>
    <rect x="40" y="10" width="10" height="10"/>
    <rect x="50" y="10" width="10" height="10"/>
    <rect x="60" y="10" width="10" height="10"/>
    <rect x="70" y="10" width="10" height="10"/>

    <rect x="10" y="20" width="10" height="10"/>
    <rect x="80" y="20" width="10" height="10"/>

    <rect x="10" y="30" width="10" height="10"/>
    <rect x="80" y="30" width="10" height="10"/>

    <rect x="10" y="40" width="10" height="10"/>
    <rect x="80" y="40" width="10" height="10"/>

    <rect x="10" y="50" width="10" height="10"/>
    <rect x="80" y="50" width="10" height="10"/>

    <rect x="20" y="60" width="10" height="10"/>
    <rect x="70" y="60" width="10" height="10"/>

    <rect x="30" y="70" width="10" height="10"/>
    <rect x="60" y="70" width="10" height="10"/>

    <rect x="40" y="80" width="10" height="10"/>
    <rect x="50" y="80" width="10" height="10"/>

    <!-- Interior "C" counter-mark -->
    <rect x="35" y="25" width="10" height="10"/>
    <rect x="45" y="25" width="10" height="10"/>
    <rect x="55" y="25" width="10" height="10"/>

    <rect x="30" y="35" width="10" height="10"/>
    <rect x="30" y="45" width="10" height="10"/>
    <rect x="30" y="55" width="10" height="10"/>

    <rect x="35" y="65" width="10" height="10"/>
    <rect x="45" y="65" width="10" height="10"/>
    <rect x="55" y="65" width="10" height="10"/>
  </g>
</svg>
